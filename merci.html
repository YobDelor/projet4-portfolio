<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17242d">
    <meta name="robots" content="noindex, follow">
    <title>Message envoyé — DELOR.DEV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; padding: 28px; background: #17242d; color: #fff; text-align: center; }
        main { width: min(100%, 620px); padding: clamp(28px, 6vw, 56px); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 8px; }
        .success-icon { display: grid; width: 72px; height: 72px; margin: 0 auto 22px; place-items: center; color: #17242d; background: #ef705d; border-radius: 50%; font-size: 1.8rem; }
        h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.1; }
        p { margin: 0 auto 28px; color: rgba(255,255,255,.78); font-size: 1.05rem; }
        .button { width: auto; }
    </style>
</head>
<body>
    <main>
        <div class="success-icon" aria-hidden="true"><i class="fa-solid fa-check"></i></div>
        <p class="eyebrow" style="color:#f6a99e; letter-spacing:.14em; text-transform:uppercase; font-weight:800;">DELOR.DEV · CONTACT</p>
        <h1>Merci pour ton message !</h1>
        <p>Ton message a bien été transmis. Merci d'avoir pris le temps de me contacter. Je te répondrai dès que possible.</p>
        <a class="button button-light" href="/">Retour au portfolio <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
    </main>
</body>
</html>
